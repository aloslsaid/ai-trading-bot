# GOLD_AI_RESEARCH Milestone 1 configuration
symbol: XAUUSD
timezone_internal: UTC
data:
  raw_dir: data/raw
  processed_dir: data/processed
  yahoo_approx_dir: data/yahoo_approx
  synthetic_dir: data/synthetic
  start_date: "2026-01-01"
  # Dukascopy integer prices are divided by this (XAUUSD = 1000)
  dukascopy_point_value: 1000
  download_workers: 1
  max_gap_minutes: 5          # gaps longer than this inside market hours are reported
  max_jump_pct: 1.5           # 1-minute close-to-close move flagged as suspicious
  day_offset_hours: 0         # shift D1/H4 bin boundaries (UTC). 0 = UTC midnight
timeframes: [M1, M5, M15, M30, H1, H4, D1, W1]
costs:
  slippage_usd: 0.05          # per side, price units (USD/oz)
  commission_per_lot_per_side: 3.5   # USD
  contract_size_oz: 100       # 1 lot = 100 oz
risk:
  initial_equity: 10000
  risk_per_trade_pct: 0.5
  max_leverage: 20
  max_open_positions: 1
  max_daily_loss_pct: 3.0
backtest:
  default_timeframe: M15
  train_frac: 0.6
  val_frac: 0.2
ml:
  horizon_bars: 3
  neutral_threshold: 0.0005
  model_path: models/xau_m15.joblib
