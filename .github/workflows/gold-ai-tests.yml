name: GOLD AI tests

on:
  pull_request:
  push:
    branches: [main, chore/inspect-archive-safely]

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: GOLD_AI_RESEARCH/requirements.txt
      - name: Install research dependencies
        working-directory: GOLD_AI_RESEARCH
        run: python -m pip install -r requirements.txt
      - name: Run unit tests
        working-directory: GOLD_AI_RESEARCH
        run: python -m pytest -q
