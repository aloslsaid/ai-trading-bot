name: Extract GOLD AI source safely

on:
  pull_request:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate and extract allow-listed source files
        run: python extract_archive.py
      - name: Commit extracted source to this PR branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add GOLD_AI_RESEARCH
          if git diff --cached --quiet; then
            echo "No source files were extracted."
          else
            git commit -m "Extract GOLD AI research source from archive"
            git push origin "HEAD:$GITHUB_HEAD_REF"
          fi
